services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  app:
    build: .
    environment:
      PGHOST: "${DB_HOST}"
      PGPORT: "${DB_PORT}"
      PGUSER: "${DB_USER}"
      PGPASSWORD: "${DB_PASSWORD}"
      PGDATABASE: "${DB_NAME}"
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - frontend
      - backend

volumes:
  pgdata:

networks:
  frontend:
  backend: